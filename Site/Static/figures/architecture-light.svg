<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" role="img" aria-labelledby="architecture-title architecture-desc">
  <title id="architecture-title">How SymLean turns proposals into checked theorems</title>
  <desc id="architecture-desc">A #cas command or a tactic goal enters SymLean. SymLean's own search and, optionally, external systems (SymPy, SageMath, Maxima, Giac, Singular, PARI/GP, FLINT and Gappa, through CASOracle and DSLean) propose answers, which are not trusted. SymLean builds certificates and proofs with Mathlib's definitions and tactics and FloatLib's certified numerics, and Lean's kernel checks the theorem, here x^4 - 1 = (x - 1)(x + 1)(x^2 + 1) for every real x.</desc>
  <defs>
    <marker id="architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8d929a"/></marker>
  </defs>
  <rect x="0" y="0" width="1240" height="470" fill="#ffffff"/>
  <rect x="10" y="30" width="250" height="82" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <path d="M18,30 h234 a8,8 0 0 1 8,8 v22 h-250 v-22 a8,8 0 0 1 8,-8 z" fill="#f4f2ec"/>
  <rect x="10" y="30" width="250" height="82" rx="8" fill="none" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="24" y="50.4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Lean input</text>
  <text font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" fill="#1d232a">
    <tspan x="24" y="90.9">#cas [factor] (x^4 - 1)</tspan>
  </text>
  <rect x="10" y="150" width="250" height="76" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <path d="M18,150 h234 a8,8 0 0 1 8,8 v22 h-250 v-22 a8,8 0 0 1 8,-8 z" fill="#f4f2ec"/>
  <rect x="10" y="150" width="250" height="76" rx="8" fill="none" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="24" y="170.4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Native search</text>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="14" fill="#6a7078">
    <tspan x="24" y="207.9">symbolic and numerical search</tspan>
  </text>
  <rect x="10" y="262" width="250" height="198" rx="10" fill="none" stroke="#8d929a" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="24" y="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">External solvers (optional)</text>
  <rect x="24" y="304" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="77" y="324.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">SymPy</text>
  <rect x="140" y="304" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="193" y="324.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">SageMath</text>
  <rect x="24" y="342" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="77" y="362.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">Maxima</text>
  <rect x="140" y="342" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="193" y="362.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">Giac</text>
  <rect x="24" y="380" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="77" y="400.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">Singular</text>
  <rect x="140" y="380" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="193" y="400.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">PARI/GP</text>
  <rect x="24" y="418" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="77" y="438.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">FLINT</text>
  <rect x="140" y="418" width="106" height="30" rx="6" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="193" y="438.0" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="14" font-weight="600" fill="#1d232a">Gappa</text>
  <rect x="286" y="334" width="104" height="56" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="14" fill="#6a7078" text-anchor="middle">
    <tspan x="338" y="357.4">CASOracle /</tspan>
    <tspan x="338" y="376.3">DSLean</tspan>
  </text>
  <rect x="424" y="20" width="168" height="64" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="508" y="40.4" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Mathlib</text>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="13.5" fill="#6a7078" text-anchor="middle">
    <tspan x="508" y="71.7">definitions and tactics</tspan>
  </text>
  <rect x="610" y="20" width="168" height="64" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="694" y="40.4" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">FloatLib</text>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="13.5" fill="#6a7078" text-anchor="middle">
    <tspan x="694" y="71.7">certified numerics</tspan>
  </text>
  <rect x="416" y="128" width="352" height="180" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <path d="M424,128 h336 a8,8 0 0 1 8,8 v42 h-352 v-42 a8,8 0 0 1 8,-8 z" fill="#f4f2ec"/>
  <rect x="416" y="128" width="352" height="180" rx="8" fill="none" stroke="#d9d5cb" stroke-width="1.2"/>
  <text x="592" y="162.4" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="26" font-weight="600" fill="#1d232a">SymLean</text>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="17" fill="#6a7078" text-anchor="middle">
    <tspan x="592" y="237.5">certificates and</tspan>
    <tspan x="592" y="260.4">proof construction</tspan>
  </text>
  <rect x="796" y="195" width="104" height="46" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="15" fill="#6a7078" text-anchor="middle">
    <tspan x="848" y="223.2">Lean kernel</tspan>
  </text>
  <rect x="926" y="143" width="304" height="150" rx="8" fill="#ffffff" stroke="#2e7d4f" stroke-width="2"/>
  <path d="M934,143 h288 a8,8 0 0 1 8,8 v22 h-304 v-22 a8,8 0 0 1 8,-8 z" fill="#f4f2ec"/>
  <rect x="926" y="143" width="304" height="150" rx="8" fill="none" stroke="#2e7d4f" stroke-width="2"/>
  <text x="940" y="163.4" font-family="system-ui, -apple-system, Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#1d232a">Checked theorem</text>
  <text font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="16.5" fill="#6a7078">
    <tspan x="940" y="227.6">∀ x : ℝ,</tspan>
    <tspan x="940" y="249.9">x⁴ − 1 = (x − 1)(x + 1)(x² + 1)</tspan>
  </text>
  <path d="M260,71 L356,71 L356,176 L416,176" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <path d="M260,188 L332,188 L332,232 L416,232" fill="none" stroke="#8d929a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#architecture-arrow)"/>
  <path d="M260,362 L286,362" fill="none" stroke="#8d929a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#architecture-arrow)"/>
  <path d="M390,362 L402,362 L402,282 L416,282" fill="none" stroke="#8d929a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#architecture-arrow)"/>
  <path d="M508,84 L508,128" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <path d="M694,84 L694,128" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <path d="M768,218 L796,218" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <path d="M900,218 L926,218" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <rect x="926" y="350" width="304" height="86" rx="8" fill="#ffffff" stroke="#d9d5cb" stroke-width="1.2"/>
  <path d="M948,380 L1002,380" fill="none" stroke="#8d929a" stroke-width="1.6" stroke-dasharray="6 5" marker-end="url(#architecture-arrow)"/>
  <text x="1018" y="385" font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="15" fill="#6a7078">proposal (not trusted)</text>
  <path d="M948,412 L1002,412" fill="none" stroke="#8d929a" stroke-width="1.6" marker-end="url(#architecture-arrow)"/>
  <text x="1018" y="417" font-family="STIX Two Text, STIX Two Math, Cambria Math, Times New Roman, DejaVu Serif, serif" font-size="15" fill="#6a7078">checked proof flow</text>
</svg>
